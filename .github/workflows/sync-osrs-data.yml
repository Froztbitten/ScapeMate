name: Sync OSRS data

on:
  workflow_dispatch:
  schedule:
    # Daily at 15:23 UTC. The non-round minute reduces GitHub Actions delays.
    - cron: '23 15 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-osrs-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, convert, and validate current data
        run: python scripts/sync_osrs_data.py
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/sync_osrs_data.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/osrs-data-refresh
          delete-branch: true
          commit-message: 'data: refresh OSRS equipment and monsters'
          title: 'data: refresh OSRS equipment and monsters'
          body: |
            Automated refresh from the open OSRS Wiki DPS calculator dataset.

            The generated files passed schema, count, checksum, unit, and
            TypeScript checks before this pull request was created.
